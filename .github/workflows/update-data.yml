name: Update market data

# Runs after the US close on weekdays and refreshes data/history.json.
# GitHub Pages itself is static: this Action is the only updater.
# If Yahoo Finance fails on a run, the script exits 0 and leaves the
# last good history.json in place — the page never goes blank.
on:
  schedule:
    - cron: "0 22 * * 1-5"  # 22:00 UTC, Mon-Fri (~17:00 ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch latest closes
        run: python scripts/fetch_data.py
      - name: Commit updated history
        run: |
          if git diff --quiet data/history.json; then
            echo "No new sessions."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Update market history"
            git push
          fi

